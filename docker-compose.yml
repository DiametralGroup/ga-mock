# Standalone local startup of the mock — `docker compose up --build` or `make up`.
# Host port 8013 follows the insights360 ecosystem's table (8010 boond,
# 8011 entra, 8012 linkedin, 8013 ga). A consumer may prefer the published image:
#   image: ghcr.io/littlebigcode/ga-mock:latest
# The healthcheck is IN the image: `depends_on: condition: service_healthy`
# works on the consumer side with nothing extra to add here.
services:
  ga-mock:
    build: .
    image: ga-mock:0.1.0
    ports:
      - "8013:8000"
    environment:
      GA_MOCK_ADMIN_ENABLED: "true"
      GA_MOCK_SEED: "42"
