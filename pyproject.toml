[project]
name = "ga-mock"
version = "0.1.0"
description = "Google Analytics 4 Data API (v1beta) mock — deterministic session-level analytics for the Boréal Conseil corporate site"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# Le périmètre des dépendances est une décision, pas un accident : FastAPI et
# uvicorn, rien d'autre. La crypto (RS256) est faite en stdlib — cf. rsa_min.py.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
ga-mock = "ga_mock.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyyaml>=6.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ga_mock"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "ARG"]
# PLR0913/PLR2004 : un mock manipule des seuils et des formes verbeuses par
# nature ; PLC0415 : les imports différés sont délibérés (montage conditionnel).
ignore = ["PLR0913", "PLR2004", "PLC0415"]

[tool.mypy]
strict = true
files = ["src/ga_mock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
pythonpath = ["."]
