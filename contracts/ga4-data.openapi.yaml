                  title: RunReportRequest
                  type: object
                StringFilter:
                  properties:
                    matchType:
                      default: EXACT
                      title: Matchtype
                      type: string
                    value:
                      default: ''
                      title: Value
                      type: string
                    caseSensitive:
                      default: false
                      title: Casesensitive
                      type: boolean
                  title: StringFilter
                  type: object
              properties:
                requests:
                  default: []
                  description: 1 to 5 requests.
                  items:
                    $ref: '#/$defs/RunReportRequest'
                  title: Requests
                  type: array
              title: BatchRunReportsRequest
              type: object
  /v1beta/properties/{property_id}/metadata:
    get:
      summary: Dimensions and metrics available on the property
      description: 'L''auto-description de la propriété — générée DEPUIS le registre.


        `properties/0/metadata` est admis, comme chez Google : le zéro désigne les

        métadonnées communes à toutes les propriétés.'
      operationId: metadata_v1beta_properties__property_id__metadata_get
      parameters:
      - name: property_id
        in: path
        required: true
        schema:
          type: string
          title: Property Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataResponse'
        '400':
          description: INVALID_ARGUMENT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: PERMISSION_DENIED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: RESOURCE_EXHAUSTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    BatchRunReportsResponse:
      properties:
        reports:
          items:
            $ref: '#/components/schemas/RunReportResponse'
          type: array
          title: Reports
          default: []
        kind:
          type: string
          title: Kind
          default: analyticsData#batchRunReports
      type: object
      title: BatchRunReportsResponse
    DimensionHeader:
      properties:
        name:
          type: string
          title: Name
      type: object
      required:
      - name
      title: DimensionHeader
    DimensionMetadata:
      properties:
        apiName:
          type: string
          title: Apiname
        uiName:
          type: string
          title: Uiname
        description:
          type: string
          title: Description
        category:
          type: string
          title: Category
        customDefinition:
          type: boolean
          title: Customdefinition
          default: false
      type: object
      required:
      - apiName
      - uiName
      - description
      - category
      title: DimensionMetadata
    DimensionValue:
      properties:
        value:
          type: string
          title: Value
      type: object
      required:
      - value
      title: DimensionValue
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorStatus'
      type: object
      required:
      - error
      title: ErrorResponse
    ErrorStatus:
      properties:
        code:
          type: integer
          title: Code
        message:
          type: string
          title: Message
        status:
          type: string
          title: Status
      type: object
      required:
      - code
      - message
      - status
      title: ErrorStatus
    MetadataResponse:
      properties:
        name:
          type: string
          title: Name
        dimensions:
          items:
            $ref: '#/components/schemas/DimensionMetadata'
          type: array
          title: Dimensions
          default: []
        metrics:
          items:
            $ref: '#/components/schemas/MetricMetadata'
          type: array
          title: Metrics
          default: []
      type: object
      required:
      - name
      title: MetadataResponse
    MetricHeader:
      properties:
        name:
          type: string
          title: Name
        type:
          type: string
          title: Type
      type: object
      required:
      - name
      - type
      title: MetricHeader
    MetricMetadata:
      properties:
        apiName:
          type: string
          title: Apiname
        uiName:
          type: string
          title: Uiname
        description:
          type: string
          title: Description
        category:
          type: string
          title: Category
        type:
          type: string
          title: Type
        customDefinition:
          type: boolean
          title: Customdefinition
          default: false
      type: object
      required:
      - apiName
      - uiName
      - description
      - category
      - type
      title: MetricMetadata
    MetricValue:
      properties:
        value:
          type: string
          title: Value
          description: Always serialized as a string (proto3 JSON).
      type: object
      required:
      - value
      title: MetricValue
    OAuthErrorResponse:
      properties:
        error:
          type: string
          title: Error
        error_description:
          type: string
          title: Error Description
      type: object
      required:
      - error
      - error_description
      title: OAuthErrorResponse
    PropertyQuota:
      properties:
        tokensPerDay:
          $ref: '#/components/schemas/QuotaStatus'
          x-ga-confidence: unverified
          x-ga-note: flat 10-token cost per report in this mock
        tokensPerHour:
          $ref: '#/components/schemas/QuotaStatus'
        concurrentRequests:
          $ref: '#/components/schemas/QuotaStatus'
        serverErrorsPerProjectPerHour:
          $ref: '#/components/schemas/QuotaStatus'
        potentiallyThresholdedRequestsPerHour:
          $ref: '#/components/schemas/QuotaStatus'
      type: object
      required:
      - tokensPerDay
      - tokensPerHour
      - concurrentRequests
      - serverErrorsPerProjectPerHour
      - potentiallyThresholdedRequestsPerHour
      title: PropertyQuota
    QuotaStatus:
      properties:
        consumed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Consumed
          description: Omitted when zero (proto3).
        remaining:
          anyOf:
          - type: integer
          - type: 'null'
          title: Remaining
          description: Omitted when zero (proto3).
      type: object
      title: QuotaStatus
    ResponseMetaData:
      properties:
        currencyCode:
          type: string
          title: Currencycode
        timeZone:
          type: string
          title: Timezone
      type: object
      required:
      - currencyCode
      - timeZone
      title: ResponseMetaData
    Row:
      properties:
        dimensionValues:
          items:
            $ref: '#/components/schemas/DimensionValue'
          type: array
          title: Dimensionvalues
          description: Omitted entirely when the report has no dimensions.
          default: []
        metricValues:
          items:
            $ref: '#/components/schemas/MetricValue'
          type: array
          title: Metricvalues
          default: []
      type: object
      title: Row
    RunReportResponse:
      properties:
        dimensionHeaders:
          items:
            $ref: '#/components/schemas/DimensionHeader'
          type: array
          title: Dimensionheaders
          default: []
        metricHeaders:
          items:
            $ref: '#/components/schemas/MetricHeader'
          type: array
          title: Metricheaders
          default: []
        rows:
          items:
            $ref: '#/components/schemas/Row'
          type: array
          title: Rows
          description: Key ABSENT when there are no rows.
          default: []
        totals:
          items:
            $ref: '#/components/schemas/Row'
          type: array
          title: Totals
          default: []
          x-ga-confidence: unverified
          x-ga-note: RESERVED_TOTAL on every regular dimension; computed BEFORE metricFilter
        maximums:
          items:
            $ref: '#/components/schemas/Row'
          type: array
          title: Maximums
          default: []
        minimums:
          items:
            $ref: '#/components/schemas/Row'
          type: array
          title: Minimums
          default: []
        rowCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rowcount
          description: Pre-pagination count; key absent when zero.
        metadata:
          $ref: '#/components/schemas/ResponseMetaData'
        propertyQuota:
          anyOf:
          - $ref: '#/components/schemas/PropertyQuota'
          - type: 'null'
        kind:
          type: string
          title: Kind
          default: analyticsData#runReport
      type: object
      required:
      - metadata
      title: RunReportResponse
    TokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        expires_in:
          type: integer
          title: Expires In
          description: '3599: the issuance second is already spent.'
        token_type:
          type: string
          title: Token Type
          default: Bearer
      type: object
      required:
      - access_token
      - expires_in
      title: TokenResponse
