openapi: 3.1.0
info:
  title: Google Analytics Data API v1beta — ga-mock contract
  version: 0.1.0
  description: 'Surface reproduced by ga-mock: the OAuth2 service-account token exchange
    and the GA4 Data API v1beta core (runReport, batchRunReports, metadata). Sources
    of truth: the public GA4 Data API v1beta REST reference and its discovery document.
    Fields marked x-ga-confidence: unverified are registered in docs/UNVERIFIED-FIELDS.md.'
paths:
  /token:
    post:
      tags:
      - oauth2
      summary: Service-account JWT-bearer token exchange
      description: 'Endpoint oauth2.googleapis.com/token — flux service account JWT-bearer.


        Le corps est parsé à la main (urllib) plutôt que via `request.form()` :

        Starlette délègue les formulaires à python-multipart, et un corps

        urlencoded ne justifie pas d''élargir les dépendances runtime.'
      operationId: token_token_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: unsupported_grant_type / invalid_grant / invalid_scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
  /v1beta/properties/{property_id}:runReport:
    post:
      summary: Run a report
      operationId: run_report_v1beta_properties__property_id__runReport_post
      parameters:
      - name: property_id
        in: path
        required: true
        schema:
          type: string
          title: Property Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunReportResponse'
        '400':
          description: INVALID_ARGUMENT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: PERMISSION_DENIED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: RESOURCE_EXHAUSTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $defs:
                BetweenFilter:
                  properties:
                    fromValue:
                      $ref: '#/$defs/NumericValue'
                    toValue:
                      $ref: '#/$defs/NumericValue'
                  required:
                  - fromValue
                  - toValue
                  title: BetweenFilter
                  type: object
                DateRange:
                  properties:
                    startDate:
                      description: YYYY-MM-DD, today, yesterday or NdaysAgo.
                      title: Startdate
                      type: string
                    endDate:
                      description: YYYY-MM-DD, today, yesterday or NdaysAgo.
                      title: Enddate
                      type: string
                    name:
                      anyOf:
                      - type: string
                      - type: 'null'
                      title: Name
                  required:
                  - startDate
                  - endDate
                  title: DateRange
                  type: object
                DimensionOrderBy:
                  properties:
                    dimensionName:
                      title: Dimensionname
                      type: string
                    orderType:
                      default: ALPHANUMERIC
                      title: Ordertype
                      type: string
                  required:
                  - dimensionName
                  title: DimensionOrderBy
                  type: object
                DimensionSpec:
                  properties:
                    name:
                      title: Name
                      type: string
                  required:
                  - name
                  title: DimensionSpec
                  type: object
                FilterExpression:
                  properties:
                    andGroup:
                      anyOf:
                      - $ref: '#/$defs/FilterExpressionList'
                      - type: 'null'
                    orGroup:
                      anyOf:
                      - $ref: '#/$defs/FilterExpressionList'
                      - type: 'null'
                    notExpression:
                      anyOf:
                      - $ref: '#/$defs/FilterExpression'
                      - type: 'null'
                    filter:
                      anyOf:
                      - $ref: '#/$defs/FilterLeaf'
                      - type: 'null'
                  title: FilterExpression
                  type: object
                FilterExpressionList:
                  properties:
                    expressions:
                      default: []
                      items:
                        $ref: '#/$defs/FilterExpression'
                      title: Expressions
                      type: array
                  title: FilterExpressionList
                  type: object
                FilterLeaf:
                  properties:
                    fieldName:
                      title: Fieldname
                      type: string
                    stringFilter:
                      anyOf:
                      - $ref: '#/$defs/StringFilter'
                      - type: 'null'
                    inListFilter:
                      anyOf:
                      - $ref: '#/$defs/InListFilter'
                      - type: 'null'
                    numericFilter:
                      anyOf:
                      - $ref: '#/$defs/NumericFilter'
                      - type: 'null'
                    betweenFilter:
                      anyOf:
                      - $ref: '#/$defs/BetweenFilter'
                      - type: 'null'
                  required:
                  - fieldName
                  title: FilterLeaf
                  type: object
                InListFilter:
                  properties:
                    values:
                      default: []
                      items:
                        type: string
                      title: Values
                      type: array
                    caseSensitive:
                      default: false
                      title: Casesensitive
                      type: boolean
                  title: InListFilter
                  type: object
                MetricOrderBy:
                  properties:
                    metricName:
                      title: Metricname
                      type: string
                  required:
                  - metricName
                  title: MetricOrderBy
                  type: object
                MetricSpec:
                  properties:
                    name:
                      title: Name
                      type: string
                  required:
                  - name
                  title: MetricSpec
                  type: object
                NumericFilter:
                  properties:
                    operation:
                      title: Operation
                      type: string
                    value:
                      $ref: '#/$defs/NumericValue'
                  required:
                  - operation
                  - value
                  title: NumericFilter
                  type: object
                NumericValue:
                  properties:
                    int64Value:
                      anyOf:
                      - type: string
                      - type: 'null'
                      description: int64 carried as a string.
                      title: Int64Value
                    doubleValue:
                      anyOf:
                      - type: number
                      - type: 'null'
                      title: Doublevalue
                  title: NumericValue
                  type: object
                OrderBy:
                  properties:
                    desc:
                      default: false
                      title: Desc
                      type: boolean
                    metric:
                      anyOf:
                      - $ref: '#/$defs/MetricOrderBy'
                      - type: 'null'
                    dimension:
                      anyOf:
                      - $ref: '#/$defs/DimensionOrderBy'
                      - type: 'null'
                  title: OrderBy
                  type: object
                StringFilter:
                  properties:
                    matchType:
                      default: EXACT
                      title: Matchtype
                      type: string
                    value:
                      default: ''
                      title: Value
                      type: string
                    caseSensitive:
                      default: false
                      title: Casesensitive
                      type: boolean
                  title: StringFilter
                  type: object
              properties:
                dateRanges:
                  default: []
                  description: 1 to 4 ranges.
                  items:
                    $ref: '#/$defs/DateRange'
                  title: Dateranges
                  type: array
                dimensions:
                  default: []
                  description: Up to 9.
                  items:
                    $ref: '#/$defs/DimensionSpec'
                  title: Dimensions
                  type: array
                metrics:
                  default: []
                  description: 1 to 10.
                  items:
                    $ref: '#/$defs/MetricSpec'
                  title: Metrics
                  type: array
                dimensionFilter:
                  anyOf:
                  - $ref: '#/$defs/FilterExpression'
                  - type: 'null'
                metricFilter:
                  anyOf:
                  - $ref: '#/$defs/FilterExpression'
                  - type: 'null'
                  description: Applied AFTER aggregation, on requested metrics.
                limit:
                  anyOf:
                  - type: integer
                  - type: string
                  - type: 'null'
                  title: Limit
                  x-ga-confidence: unverified
                  x-ga-note: int64 accepted as number or string; over 250000 silently
                    capped; 0 falls back to the 10000 default.
                offset:
                  anyOf:
                  - type: integer
                  - type: string
                  - type: 'null'
                  title: Offset
                orderBys:
                  default: []
                  items:
                    $ref: '#/$defs/OrderBy'
                  title: Orderbys
                  type: array
                metricAggregations:
                  default: []
                  description: TOTAL, MAXIMUM and MINIMUM are supported.
                  items:
                    type: string
                  title: Metricaggregations
                  type: array
                keepEmptyRows:
                  default: false
                  title: Keepemptyrows
                  type: boolean
                returnPropertyQuota:
                  default: false
                  title: Returnpropertyquota
                  type: boolean
              title: RunReportRequest
              type: object
  /v1beta/properties/{property_id}:batchRunReports:
    post:
      summary: Run up to 5 reports in one call
      description: '≤ 5 sous-rapports ; l''auth, la propriété et le JSON se contrôlent
        UNE

        fois au niveau du lot, puis chaque sous-rapport traverse le pipeline

        complet — une sous-requête invalide fait échouer tout le lot.'
      operationId: batch_run_reports_v1beta_properties__property_id__batchRunReports_post
      parameters:
      - name: property_id
        in: path
        required: true
        schema:
          type: string
          title: Property Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRunReportsResponse'
        '400':
          description: INVALID_ARGUMENT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: PERMISSION_DENIED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: RESOURCE_EXHAUSTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $defs:
                BetweenFilter:
                  properties:
                    fromValue:
                      $ref: '#/$defs/NumericValue'
                    toValue:
                      $ref: '#/$defs/NumericValue'
                  required:
                  - fromValue
                  - toValue
                  title: BetweenFilter
                  type: object
                DateRange:
                  properties:
                    startDate:
                      description: YYYY-MM-DD, today, yesterday or NdaysAgo.
                      title: Startdate
                      type: string
                    endDate:
                      description: YYYY-MM-DD, today, yesterday or NdaysAgo.
                      title: Enddate
                      type: string
                    name:
                      anyOf:
                      - type: string
                      - type: 'null'
                      title: Name
                  required:
                  - startDate
                  - endDate
                  title: DateRange
                  type: object
                DimensionOrderBy:
                  properties:
                    dimensionName:
                      title: Dimensionname
                      type: string
                    orderType:
                      default: ALPHANUMERIC
                      title: Ordertype
                      type: string
                  required:
                  - dimensionName
                  title: DimensionOrderBy
                  type: object
                DimensionSpec:
                  properties:
                    name:
                      title: Name
                      type: string
                  required:
                  - name
                  title: DimensionSpec
                  type: object
                FilterExpression:
                  properties:
                    andGroup:
                      anyOf:
                      - $ref: '#/$defs/FilterExpressionList'
                      - type: 'null'
                    orGroup:
                      anyOf:
                      - $ref: '#/$defs/FilterExpressionList'
                      - type: 'null'
                    notExpression:
                      anyOf:
                      - $ref: '#/$defs/FilterExpression'
                      - type: 'null'
                    filter:
                      anyOf:
                      - $ref: '#/$defs/FilterLeaf'
                      - type: 'null'
                  title: FilterExpression
                  type: object
                FilterExpressionList:
                  properties:
                    expressions:
                      default: []
                      items:
                        $ref: '#/$defs/FilterExpression'
                      title: Expressions
                      type: array
                  title: FilterExpressionList
                  type: object
                FilterLeaf:
                  properties:
                    fieldName:
                      title: Fieldname
                      type: string
                    stringFilter:
                      anyOf:
                      - $ref: '#/$defs/StringFilter'
                      - type: 'null'
                    inListFilter:
                      anyOf:
                      - $ref: '#/$defs/InListFilter'
                      - type: 'null'
                    numericFilter:
                      anyOf:
                      - $ref: '#/$defs/NumericFilter'
                      - type: 'null'
                    betweenFilter:
                      anyOf:
                      - $ref: '#/$defs/BetweenFilter'
                      - type: 'null'
                  required:
                  - fieldName
                  title: FilterLeaf
                  type: object
                InListFilter:
                  properties:
                    values:
                      default: []
                      items:
                        type: string
                      title: Values
                      type: array
                    caseSensitive:
                      default: false
                      title: Casesensitive
                      type: boolean
                  title: InListFilter
                  type: object
                MetricOrderBy:
                  properties:
                    metricName:
                      title: Metricname
                      type: string
                  required:
                  - metricName
                  title: MetricOrderBy
                  type: object
                MetricSpec:
                  properties:
                    name:
                      title: Name
                      type: string
                  required:
                  - name
                  title: MetricSpec
                  type: object
                NumericFilter:
                  properties:
                    operation:
                      title: Operation
                      type: string
                    value:
                      $ref: '#/$defs/NumericValue'
                  required:
                  - operation
                  - value
                  title: NumericFilter
                  type: object
                NumericValue:
                  properties:
                    int64Value:
                      anyOf:
                      - type: string
                      - type: 'null'
                      description: int64 carried as a string.
                      title: Int64Value
                    doubleValue:
                      anyOf:
                      - type: number
                      - type: 'null'
                      title: Doublevalue
                  title: NumericValue
                  type: object
                OrderBy:
                  properties:
                    desc:
                      default: false
                      title: Desc
                      type: boolean
                    metric:
                      anyOf:
                      - $ref: '#/$defs/MetricOrderBy'
                      - type: 'null'
                    dimension:
                      anyOf:
                      - $ref: '#/$defs/DimensionOrderBy'
                      - type: 'null'
                  title: OrderBy
                  type: object
                RunReportRequest:
                  properties:
