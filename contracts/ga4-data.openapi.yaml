                      items:
                        $ref: '#/$defs/DateRange'
                      title: Dateranges
                      type: array
                    dimensions:
                      default: []
                      description: Up to 9.
                      items:
                        $ref: '#/$defs/DimensionSpec'
                      title: Dimensions
                      type: array
                    metrics:
                      default: []
                      description: 1 to 10.
                      items:
                        $ref: '#/$defs/MetricSpec'
                      title: Metrics
                      type: array
                    dimensionFilter:
                      anyOf:
                      - $ref: '#/$defs/FilterExpression'
                      - type: 'null'
                    metricFilter:
                      anyOf:
                      - $ref: '#/$defs/FilterExpression'
                      - type: 'null'
                      description: Applied AFTER aggregation, on requested metrics.
                    limit:
                      anyOf:
                      - type: integer
                      - type: string
                      - type: 'null'
                      title: Limit
                      x-ga-confidence: unverified
                      x-ga-note: int64 accepted as number or string; over 250000 silently
                        capped; 0 falls back to the 10000 default.
                    offset:
                      anyOf:
                      - type: integer
                      - type: string
                      - type: 'null'
                      title: Offset
                    orderBys:
                      default: []
                      items:
                        $ref: '#/$defs/OrderBy'
                      title: Orderbys
                      type: array
                    metricAggregations:
                      default: []
                      description: TOTAL, MAXIMUM and MINIMUM are supported.
                      items:
                        type: string
                      title: Metricaggregations
                      type: array
                    keepEmptyRows:
                      default: false
                      title: Keepemptyrows
